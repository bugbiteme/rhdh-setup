app:
  title: Red Hat Developer Hub
  baseUrl: ${RHDH_URL}

backend:
  auth:
    externalAccess:
      - type: legacy
        options:
          subject: legacy-default-config
          secret: ${BACKEND_SECRET}

  baseUrl: ${RHDH_URL}

  cors:
    origin: ${RHDH_URL}

  cache:
    store: redis
    connection: ${REDIS_URL}

  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DATABASE}
    pluginDivisionMode: schema

auth:
  environment: development
  providers:
    github:
      development:
        clientId: ${GITHUB_APP_CLIENT_ID}
        clientSecret: ${GITHUB_APP_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

catalog:

  locations:
    - type: url
      target: https://github.com/bugbiteme/rhdh-setup/blob/main/manifests/demo-app/catalog-info.yaml
      rules:
        - allow: [Component]

  providers:
    githubOrg:
      id: githuborg
      githubUrl: ${GITHUB_URL}
      orgs: ["${GITHUB_ORG}"]
      schedule:
        frequency: { minutes: 30 }
        timeout: { minutes: 15 }
        initialDelay: { seconds: 15 }

integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_APP_ID}
          clientId: ${GITHUB_APP_CLIENT_ID_INTEGRATION}
          clientSecret: ${GITHUB_APP_CLIENT_SECRET_INTEGRATION}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}

argocd:
  appLocatorMethods:
    - type: config
      instances:
        - name: rhdh-gitops
          url: ${ARGOCD_URL}
          username: ${ARGOCD_USERNAME}
          password: ${ARGOCD_PASSWORD}

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: ${K8S_CLUSTER_NAME}
          url: ${K8S_CLUSTER_URL}
          authProvider: serviceAccount
          skipTLSVerify: true
          skipMetricsLookup: false
          dashboardApp: openshift
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          caData: ${K8S_CLUSTER_CA}
          