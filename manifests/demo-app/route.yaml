apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: demo-app
  namespace: rhdh-demo
  labels:
    app: demo-app
    backstage.io/kubernetes-id: demo-app
spec:
  to:
    kind: Service
    name: demo-app
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect